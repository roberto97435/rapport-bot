<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Rapport du bot</title>
<style>
:root{--fond:#0f1626;--surface:#172238;--trait:#2a3857;--texte:#e9edf5;--doux:#93a0bb;--or:#e2b650;--perte:#f26b5e;
  font-family:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:light){:root{--fond:#f3f5f9;--surface:#fff;--trait:#e1e6ef;--texte:#152034;--doux:#5f6b82;--or:#b8871c;--perte:#cc3b2f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fond);color:var(--texte);padding:20px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--trait);border-radius:20px;padding:26px 22px}
.lingot{width:34px;height:22px;border-radius:4px;transform:skewX(-14deg);margin-bottom:16px;
  background:linear-gradient(135deg,#f6dc8a,var(--or) 45%,#b98d27)}
h1{font-size:19px;margin:0 0 4px} p{font-size:13.5px;color:var(--doux);margin:0 0 18px;line-height:1.45}
input[type=password]{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--trait);
  background:transparent;color:var(--texte);outline:none}
input[type=password]:focus{border-color:var(--or)}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--doux);margin:12px 0 16px}
button{width:100%;font-size:15px;font-weight:650;padding:12px;border:0;border-radius:12px;background:var(--or);color:#1a1405;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--perte);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f">
  <div class="lingot" aria-hidden="true"></div>
  <h1>Rapport du bot</h1>
  <p>Ce rapport est chiffré. Entre ton code pour l'ouvrir : il est déchiffré dans ce navigateur et ne quitte jamais l'appareil.</p>
  <input id="c" type="password" autocomplete="current-password" placeholder="Code" autofocus aria-label="Code">
  <label><input id="m" type="checkbox"> Se souvenir sur cet appareil</label>
  <button id="b" type="submit">Ouvrir le rapport</button>
  <div class="err" id="e" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const vers64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function ouvrir(cle){
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},cle,b64(P.donnees));
  document.open();document.write(new TextDecoder().decode(clair));document.close();
}
async function depuisCode(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.sel),iterations:P.iterations,hash:"SHA-256"},

}
(async()=>{
  if(!window.crypto||!crypto.subtle){document.getElementById("e").textContent="Ce navigateur ne sait pas déchiffrer : ouvre le lien en https.";return;}

  document.getElementById("f").addEventListener("submit",async ev=>{

    const b=document.getElementById("b"),e=document.getElementById("e");
    b.disabled=true;e.textContent="";b.textContent="Déchiffrement…";
    try{
      // la case est lue AVANT d'afficher le rapport : une fois la page
      // remplacee, elle n'existe plus
      const garder=document.getElementById("m").checked;
      const cle=await depuisCode(document.getElementById("c").value);
      const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},cle,b64(P.donnees));
      if(garder) localStorage.setItem(CLE,vers64(await crypto.subtle.exportKey("raw",cle)));
      document.open();document.write(new TextDecoder().decode(clair));document.close();
    }catch(x){e.textContent="Code incorrect.";b.disabled=false;b.textContent="Ouvrir le rapport";}
  });
})();
